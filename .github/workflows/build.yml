name: Build Calculator APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools & platform
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Compile resources
        run: |
          BT=$ANDROID_HOME/build-tools/34.0.0
          PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar
          mkdir -p out/compiled out/gen out/classes
          $BT/aapt2 compile --dir . -o out/compiled/res.zip 2>/dev/null || \
          $BT/aapt2 compile --dir . -o out/compiled/res.zip
          $BT/aapt2 link -o out/app-unsigned.apk \
            -I $PLATFORM \
            --manifest AndroidManifest.xml \
            -R out/compiled/res.zip \
            --java out/gen \
            --min-sdk-version 21 \
            --target-sdk-version 34

      - name: Compile Java
        run: |
          PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar
          javac -source 8 -target 8 \
            -bootclasspath $PLATFORM \
            -classpath $PLATFORM \
            -d out/classes \
            MainActivity.java out/gen/com/example/calculator/R.java

      - name: Dex
        run: |
          BT=$ANDROID_HOME/build-tools/34.0.0
          $BT/d8 --lib $ANDROID_HOME/platforms/android-34/android.jar \
            --min-api 21 \
            --output out/ \
            $(find out/classes -name "*.class")

      - name: Package APK
        run: |
          BT=$ANDROID_HOME/build-tools/34.0.0
          cd out
          cp app-unsigned.apk app.apk
          zip -uj app.apk classes.dex
          cd ..

      - name: Sign APK
        run: |
          BT=$ANDROID_HOME/build-tools/34.0.0
          keytool -genkeypair -v -keystore out/ks.jks \
            -alias key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=Calc"
          $BT/zipalign -v -p 4 out/app.apk out/app-aligned.apk
          $BT/apksigner sign --ks out/ks.jks \
            --ks-pass pass:123456 --key-pass pass:123456 \
            --out calculator.apk out/app-aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: calculator.apk
